<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="introduction.css">
    <title>Document</title>


</head>

<body>
    <div class="head">
        <h1 id="timer">JesskyLau</h1>
        <div id="clock" class="clock"></div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Works</a></li>
            <li><a href="#">About me </a></li>
        </ul>
    </div>
    <div class="box">
        <div class="left">left</div>
        <div class="center">center</div>
        <div class="right">right</div>
    </div>
    <div class="footer">
        888
    </div>
    <script>
        function updateClock() {
            const now = new Date();

            // 自定义格式：年-月-日 时:分:秒
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeString = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            // 更新到页面元素
            document.getElementById('clock').innerText = timeString;
        }

        // 每1000毫秒（1秒）执行一次
        setInterval(updateClock, 1000);

        // 页面加载后立即执行一次，避免1秒空白
        updateClock();

        let clock = document.querySelector(".clock")
        clock.onmouseenter = function () {
            clock.style.boxShadow = "0 4px 8px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19)"
            clock.style.transform = "translateY(-5px)"

        }
        clock.onmouseleave = function () {
            clock.style.boxShadow = "none"
            clock.style.transform = "translateY(0)"

        }

    </script>
</body>

</html>
